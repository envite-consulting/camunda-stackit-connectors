# Container images used by the integration tests. Pinned so a build is reproducible and an image
# bump is a one-line change.
#
# LocalStack rather than MinIO: the MinIO community image is no longer publicly pullable. The Docker
# Hub repository minio/minio has been withdrawn (the Docker Hub API answers "object not found" for
# it) and quay.io/minio/minio rejects anonymous pulls with "unauthorized", so a MinIO-based
# integration test cannot run on a clean machine or in CI. LocalStack's S3 is public, speaks the
# same S3 protocol and supports presigned URLs, which is what these tests need.
#
# Neither LocalStack nor MinIO is NetApp StorageGRID, so neither reproduces STACKIT's checksum
# restriction. That is covered by ChecksumHeaderRegressionTest, which asserts on the bytes the AWS
# SDK puts on the wire and therefore does not depend on what a server accepts.
# Pin the 4.x line: from the 2026.x releases on, localstack/localstack is the Pro image and refuses
# to start without a LOCALSTACK_AUTH_TOKEN ("License activation failed", exit code 55). 4.14.0 is
# the community edition and reports `"edition": "community"` on its health endpoint.
s3.image=localstack/localstack:4.14.0
