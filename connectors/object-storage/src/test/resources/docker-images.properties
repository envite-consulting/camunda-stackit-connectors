# Container images used by the integration tests. Pinned so a build is reproducible and an image
# bump is a one-line change.
#
# Floci (https://floci.io, MIT) is a free, open-source local AWS emulator whose S3 implementation
# supports everything these tests need: path-style addressing, user metadata, copy, ListObjectsV2
# and SigV4 presigned GET/PUT URLs. It replaces LocalStack, whose current images refuse to start
# without an auth token, and MinIO, whose community image is no longer publicly pullable.
#
# Floci is not NetApp StorageGRID, so it does not reproduce STACKIT's checksum restriction. That
# is covered twice: ChecksumHeaderRegressionTest asserts on the bytes the AWS SDK puts on the wire,
# and the opt-in live tests (it/live, see README.md "Testing against real STACKIT") run against
# STACKIT itself.
s3.image=floci/floci:2.4.0
