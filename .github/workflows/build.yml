# Pull request gate for camunda-stackit-connectors.
#
# Build facts this workflow is built around:
#   * Java 21 and Maven 3.10.0 are mandatory. Maven is pinned by the committed
#     Maven Wrapper (distributionType=only-script), so every Maven invocation
#     here goes through ./mvnw - never a runner-provided `mvn`. Accordingly,
#     actions/setup-java is used for the JDK and the ~/.m2 cache only.
#   * A normal local build auto-applies Spotless and the license headers via the
#     `autoFormat` profile, which is active by default. CI must never fix, only
#     check, so every Maven call disables it with -P'!autoFormat'.
#   * Element templates are generated build output. They are committed, so CI
#     re-generates them and proves the working tree is unchanged.
#   * Every action is pinned to a full commit SHA, with the release it
#     corresponds to as a trailing comment. Dependabot keeps both current.
#   * The weekly scheduled run catches what changes without a commit: a new
#     CodeQL query pack, a moved container image, a broken upstream release.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

# Least privilege by default; jobs that need more raise it locally.
permissions:
  contents: read

# A newer push to a pull request supersedes the running build. Runs on main are
# never cancelled, so every commit there keeps its own CodeQL and test result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs surefire (unit tests) and failsafe (the @Tag("integration")
      # Testcontainers tests against Floci). GitHub-hosted Ubuntu runners ship a
      # running Docker daemon, so Testcontainers works without extra setup. The
      # @Tag("live") tests against real STACKIT are never selected here.
      - name: Build and run all tests
        run: ./mvnw -B -P'!autoFormat' verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

      # Reporting must never be the reason a build goes red: `require_tests` and
      # `fail_on_failure` stay off (the Maven step already failed the job if a
      # test failed) and the step is continue-on-error so a missing report
      # directory cannot fail the job. `annotate_only` writes annotations and
      # the job summary without creating a check run, so no `checks: write`
      # permission is needed.
      - name: Publish test summary
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
          check_name: Test results
          annotate_only: true
          detailed_summary: true
          include_passed: false
          require_tests: false
          fail_on_failure: false

  format:
    name: Formatting and license headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `!autoFormat` switches off the auto-applying profile, `checkFormat`
      # turns spotless:check and license:check on. Without the former the build
      # would quietly reformat and then pass.
      - name: Check Spotless formatting and license headers
        id: check
        run: ./mvnw -B -P'!autoFormat' -PcheckFormat validate

      - name: Explain how to fix formatting
        if: failure() && steps.check.outcome == 'failure'
        run: |
          echo "::error title=Formatting or license headers are off::Run './mvnw spotless:apply license:format' locally and commit the result. A plain './mvnw verify' also fixes both automatically, because the autoFormat profile is active by default."
          exit 1

  element-templates:
    name: Element templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # element-template-generator-maven-plugin is bound to process-classes, so
      # this regenerates every template without running tests or packaging.
      - name: Regenerate element templates
        run: ./mvnw -B -P'!autoFormat' -DskipTests process-classes

      # `git add -N` is what makes *newly created* templates show up in
      # `git diff` as content rather than as an untracked file; nothing is
      # actually staged for commit. `versioned/` is excluded on purpose: those
      # snapshots are pinned to a released template version and are not
      # overwritten on regeneration.
      - name: Check committed templates match their Java source
        shell: bash
        run: |
          set -euo pipefail
          PATHSPEC=(
            '*/element-templates/*.json'
            '*/element-templates/hybrid/*.json'
            '*/*/element-templates/*.json'
            '*/*/element-templates/hybrid/*.json'
            ':(exclude)*/element-templates/versioned/*'
            ':(exclude)*/*/element-templates/versioned/*'
          )
          # Guard: `git add -N` aborts with a bare "fatal: pathspec ... did not
          # match any files" when *none* of the pathspecs match anything at all,
          # which would mask the real problem. `git ls-files` tolerates
          # unmatched pathspecs, so it is safe to probe with. (A pathspec set
          # where only *some* entries match is fine for `git add -N`.)
          if [ -z "$(git ls-files --cached --others --exclude-standard -- "${PATHSPEC[@]}")" ]; then
            echo "::error::No element templates found after 'process-classes'. Expected generated templates under <module>/element-templates/. Check the @ElementTemplate annotations and the element-template-generator-maven-plugin binding."
            exit 1
          fi
          git add -N -- "${PATHSPEC[@]}"
          if git diff --quiet -- "${PATHSPEC[@]}"; then
            echo "::notice::Element templates match their Java source."
          else
            echo "::error::Element templates are out of sync with their Java source. Run './mvnw -DskipTests process-classes' and commit the regenerated templates."
            git diff --stat -- "${PATHSPEC[@]}"
            git diff -- "${PATHSPEC[@]}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install validator dependencies
        run: npm ci --prefix tools

      # Validates every committed template (including hybrid/ and versioned/)
      # against the official Camunda 8 / Zeebe element-template JSON schema.
      # Equivalent to `npm run --prefix tools validate:templates`.
      - name: Validate templates against the Zeebe JSON schema
        run: node tools/validate-element-templates.mjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode: none uses CodeQL's buildless Java extractor, so the Maven
      # build is not duplicated here. Requires that CodeQL "default setup" is
      # disabled for this repository, otherwise GitHub rejects this workflow's
      # uploads as a conflicting configuration.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: the action diffs the dependency graph
    # of the base ref against the head ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This project is Apache-2.0 and is redistributed as a shaded
      # *-with-dependencies.jar, i.e. dependencies are statically linked. Strong
      # copyleft (GPL/AGPL/SSPL/OSL/EUPL) is therefore incompatible outright,
      # and weak copyleft (LGPL) is incompatible in practice once shaded. Both
      # the current and the deprecated SPDX spellings are listed because the
      # dependency graph reports either, depending on the ecosystem.
      #
      # `deny-licenses` is marked deprecated in favour of `allow-licenses`, but an
      # allow-list has to name every permissive license anywhere in the Maven and
      # npm graphs and fails Dependabot pull requests whenever one is missing.
      # Revisit when the option is actually removed.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: >-
            GPL-1.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            LGPL-2.0-only,
            LGPL-2.0-or-later,
            LGPL-2.1-only,
            LGPL-2.1-or-later,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            SSPL-1.0,
            OSL-3.0,
            EUPL-1.1,
            EUPL-1.2,
            CPAL-1.0,
            QPL-1.0

  docker-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, never push. bundle/Dockerfile lists every module pom by hand
      # for layer caching, so a new module that is not added there breaks the
      # image - this job is what notices.
      - name: Build the bundle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bundle/Dockerfile
          push: false
          tags: envite/stackit-connectors:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
