# Manual release of camunda-stackit-connectors to Maven Central via the
# Sonatype Central Portal.
#
# What a run does, in order:
#   1. Refuses anything but `main` and anything that is not a release version.
#   2. Commits the release version to every pom and tags that commit `v<version>`,
#      so the tag always builds exactly what was released.
#   3. Builds, tests (including the Floci integration tests), signs and uploads
#      to the Central Portal in a single Maven run. autoPublish=false: the
#      deployment then waits at https://central.sonatype.com/publishing/deployments
#      for a human to press "Publish".
#   4. Pushes the tag, creates the GitHub Release with the shaded jars and the
#      element templates attached.
#   5. Commits the next -SNAPSHOT version and pushes the release commit and that
#      commit to main. If main moved during the run, this last push is refused;
#      the release itself is unaffected and the warning says what to do.
#
# REQUIRED SECRETS - NONE OF THESE ARE CONFIGURED YET. Create a GitHub
# environment named `maven-central` (Settings > Environments) and add them there,
# not as repository secrets: an environment can require a reviewer to approve
# every release before the secrets are released to the job.
#
#   MAVEN_CENTRAL_USERNAME  Central Portal user token *name*  (NOT the Sonatype
#                           account name - generate a token at
#                           https://central.sonatype.com/account)
#   MAVEN_CENTRAL_PASSWORD  Central Portal user token *secret*
#   GPG_PRIVATE_KEY         ASCII-armored private key block, exported with
#                           `gpg --armor --export-secret-keys <KEYID>`. Its
#                           public half must be published to a keyserver that
#                           Central checks (keys.openpgp.org / keyserver.ubuntu.com).
#   GPG_PASSPHRASE          Passphrase of that key.
#
# No credential values are hard-coded anywhere in this file, and the Maven
# settings.xml is produced by actions/setup-java (server-id / *-env-var inputs)
# rather than written by hand. The checkout does not persist the GITHUB_TOKEN:
# the Maven build runs third-party plugin code, so the token is handed to git
# only in the steps that push.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without -SNAPSHOT, e.g. 0.1.0'
        required: true
        type: string
      next_version:
        description: >-
          Next development version, e.g. 0.2.0-SNAPSHOT. Leave empty for the next
          patch version (0.1.0 -> 0.1.1-SNAPSHOT; 1.0.0-rc1 -> 1.0.0-SNAPSHOT).
        required: false
        type: string
      draft_release:
        description: >-
          Create the GitHub Release as a draft. Default true, to match
          autoPublish=false on the Central Portal: both the Maven Central
          deployment and the GitHub Release are then published by hand once the
          staged deployment has been validated.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never cancel a release in flight.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    permissions:
      # Needed to push the release tag and commits and to create the GitHub Release.
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NEXT_VERSION_INPUT: ${{ inputs.next_version }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)[0-9.]*)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a release version. Expected e.g. 0.1.0 or 1.2.0-rc1, and never a -SNAPSHOT."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if [[ -n "$NEXT_VERSION_INPUT" ]]; then
            next="$NEXT_VERSION_INPUT"
          elif [[ -n "${BASH_REMATCH[4]}" ]]; then
            next="$major.$minor.$patch-SNAPSHOT"
          else
            next="$major.$minor.$((patch + 1))-SNAPSHOT"
          fi
          if [[ ! "$next" =~ -SNAPSHOT$ ]]; then
            echo "::error::Next version '$next' must end in -SNAPSHOT."
            exit 1
          fi
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          echo "Releasing $RELEASE_VERSION, then continuing on $next."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Generates ~/.m2/settings.xml with a <server> for the `central` id that
      # resolves its credentials from the env vars named below, imports the GPG
      # key into an isolated keyring, and configures gpg.passphraseEnvName so
      # maven-gpg-plugin reads the passphrase from $GPG_PASSPHRASE.
      - name: Set up JDK 21 and Maven Central credentials
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Must match <publishingServerId>central</publishingServerId>.
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Commit and tag the release version
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null \
             || git ls-remote --exit-code --tags origin "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi
          ./mvnw -B -ntp -P'!autoFormat' versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false -DprocessAllModules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "chore(release): $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"

      # One Maven run builds, runs every test - including the Floci integration
      # tests - and only then signs and uploads: nothing reaches Central that has
      # not been through the same gate as a pull request. -Prelease adds sources,
      # javadoc, GPG signatures and the Central publishing extension.
      - name: Build, test, sign and upload to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -P'!autoFormat' -Prelease deploy

      # Self-Managed and Camunda 8 Run users install element templates by
      # dropping the raw JSON into their Modeler resources directory, and the
      # Camunda Marketplace only ever serves the latest version - so every
      # release must carry its own downloadable copies.
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/element-templates

          # Each template is flattened from
          # `connectors/object-storage/element-templates/hybrid/x.json` to
          # `connectors__object-storage__hybrid__x.json`, so that templates from
          # different modules cannot collide as release assets. `release-assets`
          # is pruned from the search as well, otherwise `find` would stream back
          # the copies this very loop creates.
          template_count=0
          while IFS= read -r -d '' template; do
            flat="${template#./}"
            flat="${flat//\/element-templates\//__}"
            flat="${flat//\//__}"
            cp "$template" "release-assets/element-templates/$flat"
            template_count=$((template_count + 1))
          done < <(find . -type d \( -name target -o -name release-assets -o -name node_modules -o -name .git \) -prune \
            -o -type f -path '*/element-templates/*' -name '*.json' -print0)

          if [[ "$template_count" -eq 0 ]]; then
            echo "::error::No element templates found to attach to the release."
            exit 1
          fi
          echo "Collected $template_count element template(s)."

          ( cd release-assets && zip -q -r "element-templates-$RELEASE_VERSION.zip" element-templates )

          jar_count=0
          while IFS= read -r -d '' jar; do
            cp "$jar" release-assets/
            jar_count=$((jar_count + 1))
          done < <(find . -type f -path '*/target/*-with-dependencies.jar' -print0)

          if [[ "$jar_count" -eq 0 ]]; then
            echo "::error::No *-with-dependencies.jar was produced. Expected one from bundle/ (spring-boot repackage) and one per connector module (maven-shade-plugin)."
            exit 1
          fi
          echo "Collected $jar_count shaded jar(s)."

          ls -la release-assets release-assets/element-templates

      - name: Push the release tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-') }}
          name: v${{ inputs.version }}
          draft: ${{ inputs.draft_release }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.jar
            release-assets/*.zip
            release-assets/element-templates/*.json
          body: |
            ## Maven Central

            ```xml
            <dependency>
              <groupId>de.envite.camunda.stackit</groupId>
              <artifactId>stackit-connector-object-storage</artifactId>
              <version>${{ inputs.version }}</version>
            </dependency>
            ```

            ## Element templates

            Camunda 8 SaaS users can install the connectors from the Camunda
            Marketplace. Self-Managed and Camunda 8 Run users should download
            the element template JSON files attached below (or
            `element-templates-${{ inputs.version }}.zip`) and place them in
            their Modeler `resources/element-templates` directory. The
            Marketplace only ever serves the latest version, so these assets are
            the only way to pin an older template.

            The `*-with-dependencies.jar` assets are the shaded runtime jars to
            mount into `camunda/connectors-bundle`.

      - name: Continue main on the next development version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -P'!autoFormat' versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false -DprocessAllModules
          git commit -q -am "chore: continue on $NEXT_VERSION"
          if ! git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main; then
            echo "::warning title=main was not advanced::main moved while the release ran, so the release commit and the bump to $NEXT_VERSION were not pushed. The release and tag v$RELEASE_VERSION are fine. Set the next version on main by hand: ./mvnw versions:set -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false -DprocessAllModules"
          fi

      - name: Remind about the manual publish step
        if: success()
        run: |
          echo "::notice title=Deployment staged::autoPublish=false - open https://central.sonatype.com/publishing/deployments and publish the staged deployment, then un-draft the GitHub Release if it was created as a draft."
